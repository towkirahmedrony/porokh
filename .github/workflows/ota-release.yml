name: OTA release (GitHub Releases)

run-name: >-
  OTA ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' || github.event_name == 'push' && vars.OTA_AUTO_PUBLISH == 'true') && 'publish attempt' || 'build/validate only (not published)' }} - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: OTA channel to publish
        required: true
        default: production-android
        type: choice
        options:
          - production-android
          - staging-android

      publish:
        description: Create the GitHub Release, upload signed assets, and update the channel pointer (off = build/validate only)
        required: true
        default: false
        type: boolean

      rollback_to:
        description: Existing release tag to point the channel at (rollback)
        required: false
        type: string

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'android/**'

permissions:
  contents: read

concurrency:
  group: ota-${{ github.event.inputs.channel || 'production-android' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Staging and Production use separate GitHub Environments.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'staging-android' && 'staging-android' || 'production-android' }}

    env:
      OTA_CHANNEL: ${{ github.event.inputs.channel || 'production-android' }}
      VITE_OTA_CHANNEL: ${{ github.event.inputs.channel || 'production-android' }}
      POROKH_OTA_CHANNEL: ${{ github.event.inputs.channel || 'production-android' }}

      POROKH_BUILD_ID: ${{ github.sha }}

      VITE_OTA_REQUIRE_SIGNATURE: 'true'
      POROKH_OTA_REQUIRE_SIGNATURE: 'true'

      CAPGO_PUBLIC_KEY: ${{ vars.CAPGO_PUBLIC_KEY }}

      VITE_OTA_POINTER_PUBLIC_KEY: ${{ vars.OTA_ED25519_PUBLIC_KEY }}
      OTA_ED25519_PUBLIC_KEY: ${{ vars.OTA_ED25519_PUBLIC_KEY }}

      OTA_REPO: towkirahmedrony/porokh-ota

      # Only expose whether the secret exists.
      OTA_TOKEN_CONFIGURED: ${{ secrets.OTA_PUBLISH_TOKEN != '' }}

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure frontend environment
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are required."
            exit 1
          fi

          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env.local

      - name: Validate public signing keys
        run: |
          set -euo pipefail

          node <<'NODE'
          const { createPublicKey } = require('node:crypto');

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          const rsaPem = (process.env.CAPGO_PUBLIC_KEY || '')
            .replace(/\\n/g, '\n')
            .trim();

          if (
            !rsaPem.startsWith('-----BEGIN RSA PUBLIC KEY-----') ||
            !rsaPem.endsWith('-----END RSA PUBLIC KEY-----')
          ) {
            fail('CAPGO_PUBLIC_KEY must be a complete PKCS#1 RSA public key.');
          }

          try {
            const rsaKey = createPublicKey(rsaPem);

            if (rsaKey.asymmetricKeyType !== 'rsa') {
              fail('CAPGO_PUBLIC_KEY is not an RSA public key.');
            }
          } catch {
            fail('CAPGO_PUBLIC_KEY could not be parsed.');
          }

          const publicKeyBase64 =
            (process.env.OTA_ED25519_PUBLIC_KEY || '').trim();

          // A canonical Base64 encoding of 32 raw Ed25519 bytes is 44
          // characters and ends with exactly one "=".
          if (!/^[A-Za-z0-9+/]{43}=$/.test(publicKeyBase64)) {
            fail('OTA_ED25519_PUBLIC_KEY must be canonical Base64 for 32 bytes.');
          }

          const raw = Buffer.from(publicKeyBase64, 'base64');

          if (
            raw.length !== 32 ||
            raw.toString('base64') !== publicKeyBase64
          ) {
            fail('OTA_ED25519_PUBLIC_KEY is invalid or not exactly 32 bytes.');
          }

          console.log('Public signing keys passed format validation.');
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify build manifest
        run: |
          set -euo pipefail

          test -f dist/version.json || {
            echo "::error::dist/version.json was not generated."
            exit 1
          }

          node <<'NODE'
          const fs = require('node:fs');

          const manifest = JSON.parse(
            fs.readFileSync('dist/version.json', 'utf8')
          );

          if (!manifest.buildId || !manifest.version || !manifest.channel) {
            console.error('::error::version.json is missing required fields.');
            process.exit(1);
          }

          if (manifest.buildId !== process.env.POROKH_BUILD_ID.slice(0, 12)) {
            console.error('::error::Build ID does not match the commit.');
            process.exit(1);
          }

          if (manifest.channel !== process.env.POROKH_OTA_CHANNEL) {
            console.error('::error::Build channel does not match OTA channel.');
            process.exit(1);
          }

          console.log('Build manifest validation passed.');
          NODE

      - name: Resolve bundle version and validate release
        id: release
        run: |
          set -euo pipefail

          summary="$(node node_modules/tsx/dist/cli.mjs scripts/check-release.ts)"

          printf '%s\n' "$summary" | tee -a "$GITHUB_OUTPUT"

          {
            echo "### OTA build and validation"
            echo ""
            printf '%s\n' "$summary" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve publish intent
        id: intent
        env:
          DISPATCH_PUBLISH: ${{ github.event.inputs.publish }}
          AUTO_PUBLISH: ${{ vars.OTA_AUTO_PUBLISH }}
          COMPUTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${DISPATCH_PUBLISH:-false}" in
              true)
                echo "publish=true" >> "$GITHUB_OUTPUT"

                if [ "${OTA_TOKEN_CONFIGURED}" != "true" ]; then
                  echo "::error::OTA_PUBLISH_TOKEN is missing. Cannot publish."
                  exit 1
                fi
                ;;

              false|"")
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "Manual publish was not requested."
                ;;

              *)
                echo "::error::Invalid publish input."
                exit 1
                ;;
            esac

          elif [ "${AUTO_PUBLISH}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"

            if [ "${OTA_TOKEN_CONFIGURED}" != "true" ]; then
              echo "::error::OTA_AUTO_PUBLISH is true but OTA_PUBLISH_TOKEN is missing."
              exit 1
            fi

          else
            echo "publish=false" >> "$GITHUB_OUTPUT"

            echo "::notice::Bundle ${COMPUTED_VERSION} was built and validated but not published."
          fi

      - name: Provision and verify signing keys
        if: steps.intent.outputs.publish == 'true'
        env:
          RSA_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
          ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
          ED25519_PUBLIC_KEY: ${{ vars.OTA_ED25519_PUBLIC_KEY }}
          RSA_PUBLIC_KEY: ${{ vars.CAPGO_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const {
            createPrivateKey,
            createPublicKey,
          } = require('node:crypto');

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function normalizePem(value) {
            return (value || '').replace(/\\n/g, '\n').trim();
          }

          const rsaPrivatePem = normalizePem(process.env.RSA_PRIVATE_KEY);
          const rsaPublicPem = normalizePem(process.env.RSA_PUBLIC_KEY);

          const edPrivatePem = normalizePem(
            process.env.ED25519_PRIVATE_KEY
          );

          const edPublicBase64 = (
            process.env.ED25519_PUBLIC_KEY || ''
          ).trim();

          if (!rsaPrivatePem || !rsaPublicPem) {
            fail('RSA signing key pair is incomplete.');
          }

          if (!edPrivatePem || !edPublicBase64) {
            fail('Ed25519 signing key pair is incomplete.');
          }

          if (!rsaPrivatePem.startsWith('-----BEGIN RSA PRIVATE KEY-----')) {
            fail('CAPGO_PRIVATE_KEY must use PKCS#1 RSA private key format.');
          }

          let rsaPrivate;
          let rsaPublic;
          let edPrivate;

          try {
            rsaPrivate = createPrivateKey(rsaPrivatePem);
            rsaPublic = createPublicKey(rsaPublicPem);
            edPrivate = createPrivateKey(edPrivatePem);
          } catch {
            fail('One or more signing keys could not be parsed.');
          }

          if (rsaPrivate.asymmetricKeyType !== 'rsa') {
            fail('CAPGO_PRIVATE_KEY is not an RSA private key.');
          }

          if (edPrivate.asymmetricKeyType !== 'ed25519') {
            fail('OTA_ED25519_PRIVATE_KEY is not an Ed25519 private key.');
          }

          // Verify that the RSA private key matches CAPGO_PUBLIC_KEY.
          const derivedRsaPublic = createPublicKey(rsaPrivate).export({
            format: 'der',
            type: 'spki',
          });

          const configuredRsaPublic = rsaPublic.export({
            format: 'der',
            type: 'spki',
          });

          if (!Buffer.from(derivedRsaPublic).equals(
            Buffer.from(configuredRsaPublic)
          )) {
            fail('CAPGO_PRIVATE_KEY does not match CAPGO_PUBLIC_KEY.');
          }

          // Verify strict Base64 and the Ed25519 key pair.
          if (!/^[A-Za-z0-9+/]{43}=$/.test(edPublicBase64)) {
            fail('OTA_ED25519_PUBLIC_KEY has an invalid Base64 format.');
          }

          const configuredEdRaw = Buffer.from(edPublicBase64, 'base64');

          if (
            configuredEdRaw.length !== 32 ||
            configuredEdRaw.toString('base64') !== edPublicBase64
          ) {
            fail('OTA_ED25519_PUBLIC_KEY must decode to exactly 32 bytes.');
          }

          const derivedEdSpki = createPublicKey(edPrivate).export({
            format: 'der',
            type: 'spki',
          });

          const derivedEdRaw = Buffer.from(derivedEdSpki).subarray(-32);

          if (!derivedEdRaw.equals(configuredEdRaw)) {
            fail('OTA_ED25519_PRIVATE_KEY does not match OTA_ED25519_PUBLIC_KEY.');
          }

          // The Capgo native encryption process requires the RSA private key
          // as a temporary file. The Ed25519 private key stays in memory.
          const rsaPath = path.join(
            process.env.RUNNER_TEMP,
            'capgo_key_v2'
          );

          fs.writeFileSync(rsaPath, `${rsaPrivatePem}\n`, {
            mode: 0o600,
            flag: 'wx',
          });

          fs.chmodSync(rsaPath, 0o600);

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `CAPGO_PRIVATE_KEY_PATH=${rsaPath}\n`
          );

          console.log('RSA and Ed25519 key pairs verified successfully.');
          NODE

      - name: Validate release with signing credentials
        if: steps.intent.outputs.publish == 'true'
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          node node_modules/tsx/dist/cli.mjs scripts/check-release.ts --publish

      - name: Publish to GitHub Releases
        id: publish
        if: steps.intent.outputs.publish == 'true'
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          OTA_ED25519_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
          OTA_ROLLBACK_TO: ${{ github.event.inputs.rollback_to }}
          BUNDLE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${OTA_PUBLISH_TOKEN:-}" ]; then
            echo "::error::OTA_PUBLISH_TOKEN is missing."
            exit 1
          fi

          if [ -z "${BUNDLE_VERSION:-}" ]; then
            echo "::error::No bundle version was produced."
            exit 1
          fi

          if [ -z "${CAPGO_PRIVATE_KEY_PATH:-}" ]; then
            echo "::error::RSA signing key was not provisioned."
            exit 1
          fi

          args=(scripts/publish-ota-release.ts --publish)

          if [ -n "${OTA_ROLLBACK_TO:-}" ]; then
            args+=(--rollback-to "$OTA_ROLLBACK_TO")
          fi

          node node_modules/tsx/dist/cli.mjs "${args[@]}"

          # Only mark Published after the publisher exits successfully.
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Remove temporary signing keys
        if: always()
        run: |
          set -euo pipefail

          rm -f "$RUNNER_TEMP/capgo_key_v2"

          echo "Temporary RSA signing key removed."

      - name: Summarise
        if: always()
        env:
          BUNDLE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          MIN_NATIVE: ${{ steps.release.outputs.min_native_version }}
          SCHEMA: ${{ steps.release.outputs.schema_version }}
          SIGNATURE: ${{ steps.release.outputs.signature_required }}
          PUBLISH_REQUESTED: ${{ steps.intent.outputs.publish }}
          PUBLISHED: ${{ steps.publish.outputs.published || 'false' }}
        run: |
          if [ "${PUBLISHED}" = "true" ]; then
            OUTCOME="Published and verified: the signed channel pointer and release asset read-back passed."
          elif [ "${PUBLISH_REQUESTED}" = "true" ]; then
            OUTCOME="Publish step failed before verified success; inspect the release assets and channel pointer before retrying."
          else
            OUTCOME="Build and validation only; no OTA release was published."
          fi

          {
            echo ""
            echo "### OTA run outcome"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Channel | ${OTA_CHANNEL} |"
            echo "| Bundle | ${BUNDLE_VERSION:-not resolved} |"
            echo "| Release tag | ${RELEASE_TAG:-not resolved} |"
            echo "| Native requirement | nv${MIN_NATIVE:-?} |"
            echo "| Schema | db${SCHEMA:-?} |"
            echo "| Signature required | ${SIGNATURE:-?} |"
            echo "| Publish requested | ${PUBLISH_REQUESTED:-false} |"
            echo "| Published | ${PUBLISHED} |"
            echo "| Outcome | ${OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

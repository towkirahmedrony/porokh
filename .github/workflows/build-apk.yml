name: Build and Sign Android APK

# Produces a *signed release* APK that is ready to install or upload to Play.
#
# This workflow used to be the odd one out: it built on Node 20 (the Capacitor 8
# CLI requires >= 22), never wrote .env.local, and handed an unsigned APK to a
# deprecated signing action. It now shares the same environment, version-manifest
# and OTA-config checks as android.yml, signs inside Gradle with the keystore from
# repository secrets, and verifies the signature before uploading.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_CHANNEL: production-android
      VITE_OTA_CHANNEL: production-android
      POROKH_OTA_CHANNEL: production-android
      # Same per-commit identity the website, the debug APK and the OTA bundle
      # carry, so the app can tell "same build" from "new build".
      POROKH_BUILD_ID: ${{ github.sha }}
      POROKH_OTA_REQUIRE_SIGNATURE: 'true'
      VITE_OTA_REQUIRE_SIGNATURE: 'true'
      CAPGO_PUBLIC_KEY: ${{ vars.CAPGO_PUBLIC_KEY }}
      # Ed25519 key that verifies the GitHub channel pointer. It is compiled into
      # the web bundle, so an APK built without it can never verify an update.
      VITE_OTA_POINTER_PUBLIC_KEY: ${{ vars.OTA_ED25519_PUBLIC_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8 refuses to run on Node < 22, which is why the old
          # Node 20 pin failed at `cap sync android`.
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Configure frontend environment
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets are required; without them the app crashes on startup with a white screen."
            exit 1
          fi
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > .env.local

      - name: Require the signing public key
        run: |
          set -euo pipefail
          if [ -z "${CAPGO_PUBLIC_KEY:-}" ]; then
            echo "::error::CAPGO_PUBLIC_KEY is not configured. An APK built without it cannot verify any bundle, so every future update would be either rejected or unauthenticated. Set the repository variable to the Capgo key-v2 public key."
            exit 1
          fi
          node -e "
            const key = (process.env.CAPGO_PUBLIC_KEY || '').replace(/\\\\n/g, '\n').trim();
            if (!key.startsWith('-----BEGIN RSA PUBLIC KEY-----')) {
              console.error('::error::CAPGO_PUBLIC_KEY is not a PKCS#1 RSA public key');
              process.exit(1);
            }
            if (!key.endsWith('-----END RSA PUBLIC KEY-----')) {
              console.error('::error::CAPGO_PUBLIC_KEY is truncated');
              process.exit(1);
            }
            console.log('public key present (PKCS#1 RSA)');
          "
          if [ -z "${VITE_OTA_POINTER_PUBLIC_KEY:-}" ]; then
            echo "::error::OTA_ED25519_PUBLIC_KEY is not configured. The web bundle would carry no pointer verification key, so every update check would be rejected as unsigned and the app could never update."
            exit 1
          fi
          node -e "
            const raw = Buffer.from((process.env.VITE_OTA_POINTER_PUBLIC_KEY || '').trim(), 'base64');
            if (raw.length !== 32) {
              console.error('::error::OTA_ED25519_PUBLIC_KEY must be a base64 raw 32-byte Ed25519 key');
              process.exit(1);
            }
            console.log('pointer verification key present (Ed25519, 32 bytes)');
          "

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run native:sync

      - name: Verify the packaged build manifest
        run: |
          set -euo pipefail
          manifest=android/app/src/main/assets/public/version.json
          test -f "$manifest" || { echo "::error::$manifest was not produced"; exit 1; }
          python3 - "$manifest" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)

          expected = os.environ["POROKH_BUILD_ID"][:12]
          if manifest.get("buildId") != expected:
              print(
                  f"::error::packaged buildId {manifest.get('buildId')} does not match commit {expected}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("packaged manifest", manifest)
          PY

      - name: Verify the packaged OTA pointer key
        run: |
          set -euo pipefail
          # The key is inlined into the JS bundle; if it is not there, every
          # pointer fails verification on the device and OTA is dead silently.
          if ! grep -rqF "$VITE_OTA_POINTER_PUBLIC_KEY" android/app/src/main/assets/public/assets; then
            echo "::error::The packaged bundle does not contain OTA_ED25519_PUBLIC_KEY; pointer verification would always fail on the device."
            exit 1
          fi
          echo "packaged pointer verification key present"

      - name: Verify the native OTA configuration
        run: |
          set -euo pipefail
          config=android/app/src/main/assets/capacitor.config.json
          test -f "$config" || { echo "::error::$config was not produced"; exit 1; }
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const updater = config?.plugins?.CapacitorUpdater;
            if (!updater) {
              console.error('::error::CapacitorUpdater is missing from the packaged config');
              process.exit(1);
            }
            if (!updater.publicKey) {
              console.error('::error::packaged config has no publicKey; signature verification would be skipped');
              process.exit(1);
            }
            if (!String(updater.publicKey).startsWith('-----BEGIN RSA PUBLIC KEY-----')) {
              console.error('::error::packaged publicKey is not PKCS#1 RSA');
              process.exit(1);
            }
            if (updater.autoDeletePrevious !== false) {
              console.error('::error::autoDeletePrevious must be false so a rollback bundle survives confirmation');
              process.exit(1);
            }
            if (updater.autoUpdate !== 'off') {
              console.error('::error::autoUpdate must be off; activation belongs to the exam-aware gate');
              process.exit(1);
            }
            if (updater.defaultChannel !== process.env.POROKH_OTA_CHANNEL) {
              console.error('::error::defaultChannel does not match POROKH_OTA_CHANNEL', updater.defaultChannel);
              process.exit(1);
            }
            console.log('native OTA config verified: channel', updater.defaultChannel, '| signing on | manual activation');
          " "$config"

      - name: Provision the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is not configured; a release APK cannot be signed without it."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/porokh-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # keytool detects JKS vs PKCS12 itself, so this single check proves the
          # blob is a real keystore *and* that the password and alias match.
          # Failing here is better than letting Gradle emit an unsigned APK that
          # the workflow would happily upload.
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::keystore cannot be opened with KEYSTORE_PASSWORD/KEY_ALIAS; check the signing secrets."
            exit 1
          fi
          {
            echo "POROKH_KEYSTORE_FILE=$keystore"
            echo "POROKH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "POROKH_KEY_ALIAS=$KEY_ALIAS"
            echo "POROKH_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "keystore provisioned (alias $KEY_ALIAS)"

      - name: Make gradlew Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "apk=$apk"
          case "$(basename "$apk")" in
            *unsigned*) echo "::error::Gradle produced an unsigned APK; the signing config was not applied."; exit 1 ;;
          esac
          apksigner=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$apksigner" || { echo "::error::apksigner not found in the Android SDK"; exit 1; }
          # --verbose is what prints the "Verified using ... scheme" lines;
          # without it apksigner only prints "Verifies" plus the certificates.
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt || {
            echo "::error::APK is not verified with the v2 signature scheme."
            exit 1
          }
          # Fail if the certificate is the debug key rather than the release key.
          if grep -qi 'CN=Android Debug' /tmp/apksigner.txt; then
            echo "::error::APK was signed with the Android debug key, not the release keystore."
            exit 1
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: porokh-${{ env.APP_CHANNEL }}-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Summarise the build
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          size=$(du -h "$apk" | cut -f1)
          version_name=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          version_code=$(grep -oP 'versionCode \K[0-9]+' android/app/build.gradle)
          application_id=$(grep -oP 'applicationId "\K[^"]+' android/app/build.gradle)
          fingerprint=$(grep -oP 'certificate SHA-256 digest: \K.*' /tmp/apksigner.txt | head -1)
          {
            echo "### Porokh signed release APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Channel | ${APP_CHANNEL} |"
            echo "| applicationId | \`${application_id}\` |"
            echo "| versionName / versionCode | ${version_name} / ${version_code} |"
            echo "| APK | $(basename "$apk") (${size}) |"
            echo "| Signing cert SHA-256 | \`${fingerprint:-unknown}\` |"
            echo "| OTA signing | enforced (public key embedded) |"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
